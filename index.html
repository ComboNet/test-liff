<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First LINE LIFF</title>
    <!-- 1. นำเข้า LINE LIFF SDK -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .btn { background-color: #06C755; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #05b04b; }
        #status { margin-top: 20px; color: #666; }
    </style>
</head>
<body>

    <h1>LINE LIFF Demo</h1>
    <!-- ปุ่มกดสำหรับแสดง Popup User ID -->
    <button class="btn" id="btnShowId">แสดง LINE User ID</button>
    <p id="status">กำลังโหลด LIFF...</p>

    <script>
        // ใส่ LIFF ID ที่ได้จาก LINE Developers Console หลังจากทำขั้นตอนที่ 3
        const MY_LIFF_ID = '2011670896-I1d2k696'; 

        // ฟังก์ชันเริ่มต้นทำงานเมื่อเปิดหน้าเว็บ
        async function main() {
            try {
                // 2. สั่งให้ LIFF ทำงาน
                await liff.init({ liffId: MY_LIFF_ID });
                document.getElementById('status').innerText = "LIFF พร้อมใช้งานแล้ว";

                // ตรวจสอบว่าผู้ใช้ล็อกอินหรือยัง ถ้ายังให้สั่งล็อกอิน
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // เปิดใช้งานปุ่มกด
                    document.getElementById('btnShowId').addEventListener('click', showUserId);
                }
            } catch (error) {
                document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลด LIFF: " + error;
            }
        }

        // ฟังก์ชันดึง User ID และแสดง Popup
        async function showUserId() {
            try {
                // 3. ดึงข้อมูล Profile ของผู้ใช้
                const profile = await liff.getProfile();
                const userId = profile.userId; // นี่คือพารามิเตอร์ LINE User ID

                // แสดงผลลัพธ์เป็น Popup Dialog (alert)
                alert("LINE User ID ของคุณคือ:\n" + userId);
            } catch (error) {
                alert("ไม่สามารถดึงข้อมูล User ID ได้: " + error);
            }
        }

        // เริ่มต้นรันฟังก์ชันหลัก
        main();
    </script>
</body>
</html>
