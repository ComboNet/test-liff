<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบ LINE LIFF เบื้องต้น</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f0f0; }
        .profile-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; margin-top: 20px; }
        #pictureUrl { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #06C755; }
        button { background-color: #06C755; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; }
        button:hover { background-color: #05b04b; }
    </style>    
</head>
<body>

    <h1>ยินดีต้อนรับสู่ LINE LIFF App</h1>
    
    <div id="loading">กำลังโหลดข้อมูล...</div>

    <!-- ส่วนแสดงข้อมูลโปรไฟล์หลังจาก Login สำเร็จ -->
    <div id="profile-zone" class="profile-card" style="display: none;">
        <img id="pictureUrl" src="" alt="Profile Picture"><br><br>
        <p><strong>User ID:</strong> <span id="userId"></span></p>
        <p><strong>ชื่อ:</strong> <span id="displayName"></span></p>
        <p><strong>สถานะ:</strong> <span id="statusMessage"></span></p>
        
        <!-- เพิ่มปุ่มสแกน QR Code ตรงนี้ -->
        <button onclick="scanQRCode()">สแกน QR Code</button>
        <button onclick="sendFlexMessage()">ส่งข้อความเข้าแชท</button>
        <button onclick="closeLiff()">ปิดหน้าต่าง</button>
    </div>

    <script>
        // เปลี่ยนตรงนี้เป็น LIFF ID ของคุณที่ได้จาก LINE Developers Console
        const MY_LIFF_ID = '2011670896-I1d2k696'; 

        async function initLIFF() {
            try {
                // 1. เริ่มต้นระบบ LIFF
                await liff.init({ liffId: MY_LIFF_ID });

                // 2. ตรวจสอบการ Login
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // ซ่อนข้อความกำลังโหลด และแสดงโปรไฟล์
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('profile-zone').style.display = 'inline-block';
                    
                    // ดึงข้อมูลโปรไฟล์มาแสดงผล
                    const profile = await liff.getProfile();
                    document.getElementById('userId').innerText = profile.userId;
                    document.getElementById('displayName').innerText = profile.displayName;
                    document.getElementById('statusMessage').innerText = profile.statusMessage || '-';
                    document.getElementById('pictureUrl').src = profile.pictureUrl;
                }
            } catch (error) {
                console.error('LIFF Initialization failed', error);
                document.getElementById('loading').innerText = 'เกิดข้อผิดพลาดในการโหลดระบบ';
            }
        }

        // ฟังก์ชันสแกน QR Code
        async function scanQRCode() {
            // ตรวจสอบว่าเปิดทำงานบนอุปกรณ์ที่รองรับ liff.scanCodeV2 หรือไม่ (ทำงานใน LINE App เท่านั้น)
            if (liff.isApiAvailable('scanCodeV2')) {
                try {
                    const result = await liff.scanCodeV2();
                    alert('ผลการสแกน: ' + result.value);
                    // สามารถนำค่า result.value ไปใช้งานต่อ เช่น redirect หรือส่งเข้า API ได้ที่นี่
                } catch (error) {
                    console.error('Scan QR Code error:', error);
                    alert('ยกเลิกการสแกน หรือเกิดข้อผิดพลาด');
                }
            } else {
                alert('ฟังก์ชันสแกน QR Code รองรับการทำงานภายในแอปพลิเคชัน LINE เท่านั้น');
            }
        }

        function closeLiff() {
            liff.closeWindow();
        }

        function sendFlexMessage() {
            // โค้ดสำหรับส่ง Flex Message ของคุณ
            alert('เรียกใช้งานฟังก์ชันส่งข้อความ');
        }

        // เรียกใช้งานตั่งแต่เปิดหน้าเว็บ
        window.onload = function() {
            initLIFF();
        };
    </script>
</body>
</html>
