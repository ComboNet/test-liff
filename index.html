
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE LIFF Test</title>
    <!-- ใช้ SDK เวอร์ชันคงที่เพื่อความปลอดภัย -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn { background-color: #06C755; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>LINE LIFF Demo</h1>
    <button class="btn" id="btnShowId">แสดง LINE User ID</button>
    <p id="status">กำลังตรวจสอบ SDK...</p>

    <script>
        // เปลี่ยนตรงนี้เป็น LIFF ID ของคุณที่ได้มาจาก LINE Developers
        const MY_LIFF_ID = '2011670896-I1d2k696'; 

        function initLiffApp() {
            // ตรวจสอบขั้นสูงสุดว่าตรวจพบตัวแปร liff ในระบบหรือไม่
            if (typeof liff === 'undefined') {
                document.getElementById('status').innerText = "ข้อผิดพลาด: ไม่สามารถโหลดไฟล์ SDK จาก LINE ได้ (กรุณาเช็กอินเทอร์เน็ต หรือห้ามเปิดไฟล์นี้ตรงๆ)";
                return;
            }

            liff.init({ liffId: MY_LIFF_ID })
                .then(() => {
                    document.getElementById('status').innerText = "LIFF พร้อมใช้งานแล้ว!";
                    if (!liff.isLoggedIn()) {
                        liff.login();
                    } else {
                        document.getElementById('btnShowId').addEventListener('click', showUserId);
                    }
                })
                .catch((err) => {
                    document.getElementById('status').innerText = "LIFF Init ไม่ผ่าน: " + err;
                });
        }

        function showUserId() {
            liff.getProfile()
                .then(profile => {
                    alert("LINE User ID ของคุณคือ:\n" + profile.userId);
                })
                .catch(err => {
                    alert("ดึง Profile ล้มเหลว: " + err);
                });
        }

        // สั่งให้ทำงานเมื่อหน้าจอโหลดเสร็จเรียบร้อย
        window.onload = initLiffApp;
    </script>
</body>
</html>
